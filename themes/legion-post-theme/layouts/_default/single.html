{{ define "main" }}
<article class="page">
  <div class="container container-narrow">
    <header class="page-header">
      <h1>{{ .Title }}</h1>
      {{- with .Description }}<p class="page-lede">{{ . }}</p>{{ end -}}
    </header>
    <div class="prose">
      {{ with partial "crm-page-body.html" . }}{{ . }}{{ else }}{{ $.Content }}{{ end }}
    </div>
  </div>
</article>
{{ end }}
