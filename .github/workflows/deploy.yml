name: Build & Deploy

# Triggers:
# - Every push to main → build always runs (CI validation), deploy only if enabled
# - Manual trigger from Actions tab
# - workflow_dispatch is also hit by the CRM's rebuild hook (event add/edit/
#   delete → instant site rebuild) when GITHUB_DISPATCH_* is configured.
# - Hourly cron — picks up CRM event changes when the dispatch hook isn't
#   configured, and keeps the past/upcoming event split current.
on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

# Don't pile up parallel deploys for the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt every job into Node 24 for JavaScript-based actions. Without this,
# actions/checkout@v5, upload-artifact@v4, etc. emit a deprecation warning
# every run; from June 2026 Node 20 won't be available at all.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ---------- BUILD ----------
  # Always runs. Validates that the site builds with the same Hugo version,
  # flags, and content as production. Output is uploaded as an artifact for
  # the deploy job to consume.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 6

    env:
      HUGO_VERSION: "0.140.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install Hugo (extended)
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            -O /tmp/hugo.tar.gz
          tar -xzf /tmp/hugo.tar.gz -C /tmp hugo
          sudo mv /tmp/hugo /usr/local/bin/hugo
          hugo version

      - name: Build site
        run: |
          # Production build — TODO banners hidden, output goes in ./public
          hugo \
            --environment production \
            --minify \
            --gc \
            --cleanDestinationDir
          echo "✓ Built $(find public -type f | wc -l) files."

      - name: Copy PHP form endpoints into publish dir
        run: |
          # Hugo doesn't know about the forms/ tree (PHP isn't a Hugo concept).
          # Bundle them into public/_form/ so the deploy job rsyncs them too.
          mkdir -p public/_form
          cp forms/*.php public/_form/
          chmod 0644 public/_form/*.php

      - name: Upload built site as artifact
        # Even when deploy is disabled, having the artifact downloadable from
        # the Actions UI is useful — you can grab a production build without
        # running Hugo locally.
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: public/
          retention-days: 7

  # ---------- DEPLOY ----------
  # Only runs when the repo variable DEPLOY_ENABLED is set to "true".
  # Flip it on once OPS has provisioned the deploy SSH key + DNS:
  #   gh variable set DEPLOY_ENABLED --body "true" -R howarthTech/legion-rome
  # Required secrets at that point:
  #   DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH
  deploy:
    name: Deploy
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: public/

      - name: Install rsync + SSH client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync openssh-client

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete-after: remove files on the server that no longer exist in
          # the build, but only after a successful transfer (so a broken build
          # doesn't wipe the live site).
          rsync \
            -az \
            --delete-after \
            --human-readable \
            --stats \
            -e "ssh -i ~/.ssh/deploy_key -p 2222 -o UserKnownHostsFile=~/.ssh/known_hosts" \
            public/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"

      - name: Verify deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # Verify the rsynced files on the server itself. (Pre-DNS-cutover,
          # https://romelegion.org/ still resolves to the old Legionsites host,
          # so a public curl would test the wrong site. The public smoke test
          # lives in the cutover runbook.)
          set -e
          ssh -i ~/.ssh/deploy_key -p 2222 -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "grep -q 'American Legion Post 5' '${DEPLOY_PATH}index.html'"
          echo "✓ Deployed index.html present on server and contains expected title"
