<header class="site-header" role="banner">
  <div class="container header-inner">
    <a href="/" class="brand" aria-label="{{ site.Params.postName }} — home">
      <span class="brand-mark" aria-hidden="true">★</span>
      <span class="brand-text">
        <span class="brand-line1">American Legion</span>
        <span class="brand-line2">{{ site.Params.postName }}</span>
      </span>
    </a>
    <button class="nav-toggle" aria-controls="primary-nav" aria-expanded="false">
      <span class="visually-hidden">Toggle navigation</span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <ul>
        {{- range site.Menus.main }}
        <li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
      </ul>
    </nav>
  </div>
</header>
